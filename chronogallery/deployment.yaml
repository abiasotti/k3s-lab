apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronogallery
  labels:
    app: chronogallery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chronogallery
  template:
    metadata:
      labels:
        app: chronogallery
    spec:
      containers:
      - name: chronogallery
        image: ghcr.io/abiasotti/chronogallery:0.1.11
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health/
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
